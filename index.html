<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="个人博客 - 记录、思考、分享">
<title>个人博客</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 阅读进度条 -->
  <div class="reading-progress" id="reading-progress" hidden><span></span></div>

  <!-- 顶部导航 -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/">
        <span class="brand-logo">✍️</span>
        <span class="brand-name" id="site-name">My Blog</span>
      </a>

      <nav class="nav" id="nav-menu" aria-label="主导航"></nav>

      <div class="header-tools">
        <div class="search-box">
          <span class="search-icon"></span>
          <input type="search" id="search-input" placeholder="搜索文章… (Ctrl+K)" autocomplete="off">
        </div>
        <button class="icon-btn" id="btn-theme" title="切换主题" aria-label="切换主题"></button>
        <button class="icon-btn menu-btn" id="btn-menu" title="菜单" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容区（由 blog.js 渲染） -->
  <main id="app" class="app"></main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="container" id="footer-inner"></div>
  </footer>

  <!-- 浮动层 -->
  <button class="back-top" id="btn-top" title="返回顶部" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <div class="toast-box" id="toast-box" aria-live="polite"></div>

  <!-- 写文章弹层 -->
  <div class="overlay" id="editor-overlay"></div>
  <!-- 登录弹层 -->
  <div class="overlay center" id="login-overlay"></div>
  <!-- 确认弹层 -->
  <div class="overlay center" id="confirm-overlay"></div>

  <script src="blog.js"></script>
</body>
</html>
